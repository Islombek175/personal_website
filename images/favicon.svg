<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="#090d16" stroke="url(#grad)" stroke-width="20" />

  <!-- Stylized Monogram "I" with tech code angle brackets accents -->
  <!-- Left bracket < -->
  <path d="M 170 180 L 110 256 L 170 332" fill="none" stroke="#2dd4bf" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Right bracket > -->
  <path d="M 342 180 L 402 256 L 342 332" fill="none" stroke="#a855f7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Center "I" -->
  <path d="M 256 160 L 256 352" stroke="url(#grad)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Top & Bottom dots for "I" styling -->
  <circle cx="256" cy="130" r="14" fill="#2dd4bf" />
</svg>
